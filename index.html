<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>寶飽煲小館</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;image-rendering:pixelated;image-rendering:crisp-edges}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:"Courier New",Courier,monospace;background:#0d0d0d;color:#2b1a0e;touch-action:none}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;background:#1a1a1a;position:relative;overflow:hidden;border:4px solid #111}
.screen{display:none;flex-direction:column;height:100%;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
h1{font-size:clamp(16px,4.5vw,22px);color:#fff;text-align:center;line-height:1.35;margin:6px 0;text-shadow:3px 3px 0 #8b0000,-1px 0 #000,1px 0 #000,0 1px #000;letter-spacing:1px}
.sub{text-align:center;font-size:14px;color:#1a1a1a;margin-bottom:6px;line-height:1.45;font-weight:700}
.btn{border:4px solid #1a1a1a;border-radius:0;padding:12px 16px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;background:#e74c3c;color:#fff;box-shadow:4px 4px 0 #1a1a1a}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1a1a1a}
.btn.sec{background:#f1c40f;color:#1a1a1a}
.btn.big{font-size:21px;padding:16px 20px;width:100%;max-width:300px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:1;background:linear-gradient(#87ceeb 0%,#87ceeb 38%,#7ec850 38%,#7ec850 42%,#c4a574 42%,#c4a574 100%);position:relative;overflow:hidden}
.center::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent,transparent 11px,rgba(139,90,43,.18) 11px,rgba(139,90,43,.18) 14px),
  repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(0,0,0,.06) 18px,rgba(0,0,0,.06) 20px);
  pointer-events:none;opacity:.55;top:42%}
.center::after{display:none}
.center>*{position:relative;z-index:1}
.logo{font-size:40px;line-height:1;filter:drop-shadow(2px 2px 0 #1a1a1a)}
.hi{font-size:16px;font-weight:800;background:#fff;border:3px solid #1a1a1a;padding:4px 8px;box-shadow:3px 3px 0 #1a1a1a}
.hud{display:flex;justify-content:space-between;align-items:center;gap:4px;background:linear-gradient(#34495e,#2c3e50);color:#fff;border:4px solid #1a1a1a;padding:6px 8px;font-weight:900;font-size:14px;flex-shrink:0;box-shadow:4px 4px 0 #111;z-index:5}
.hud .pill{background:#1a1a1a;padding:3px 8px;border:2px solid #7f8c8d;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
#s-start .center{border:14px solid #b71c1c;border-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%23b71c1c%22/%3E%3Cpath%20d%3D%22M2%202h20v20H2zM6%206h12v12H6zM10%2010h4v4h-4z%22%20fill%3D%22none%22%20stroke%3D%22%23f4c542%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M12%202v4M12%2018v4M2%2012h4M18%2012h4%22%20stroke%3D%22%23b71c1c%22%20stroke-width%3D%222%22/%3E%3C/svg%3E") 8 round;box-shadow:inset 0 0 0 3px #f4c542,inset 0 0 0 6px #1a1a1a}
#s-start .center .corner{position:absolute;width:26px;height:26px;z-index:3;pointer-events:none;border:4px solid #f4c542;background:#b71c1c;box-shadow:0 0 0 2px #1a1a1a}
#s-start .center .corner::after{content:"";position:absolute;inset:4px;border:3px solid #f4c542}
#s-start .center .c1{left:4px;top:4px}#s-start .center .c2{right:4px;top:4px}#s-start .center .c3{left:4px;bottom:4px}#s-start .center .c4{right:4px;bottom:4px}
.px-banner{background:linear-gradient(#e74c3c,#c0392b);border:4px solid #1a1a1a;color:#fff;padding:8px;text-align:center;box-shadow:4px 4px 0 #1a1a1a}
.steps{font-size:14px;line-height:1.55;background:#fffef5;border:4px solid #1a1a1a;padding:8px 10px;max-width:320px;text-align:left;box-shadow:3px 3px 0 #1a1a1a;font-weight:700}
.stars{font-size:28px;letter-spacing:2px;color:#f1c40f;text-shadow:2px 2px 0 #1a1a1a}
.cta-top{margin:0 0 10px!important;font-size:16px!important;max-width:340px!important;width:100%;padding:10px 12px!important;border-color:#b71c1c!important;box-shadow:4px 4px 0 #f4c542!important}
.cta{margin-top:8px;font-size:14px;text-align:center;line-height:1.5;background:#fffef5;border:4px solid #1a1a1a;padding:8px 10px;max-width:320px;box-shadow:3px 3px 0 #1a1a1a;font-weight:700}

/* ===== storefront ===== */
.shop{flex:0 0 auto;position:relative;margin-top:6px;border:4px solid #1a1a1a;background:#87ceeb;overflow:hidden;min-height:196px;box-shadow:4px 4px 0 #111}
.shop-sky{position:absolute;inset:0 0 40% 0;background:linear-gradient(#6ec6ff,#87ceeb 55%,#a8d8ff);overflow:hidden}
.sun{position:absolute;right:14px;top:6px;width:22px;height:22px;background:#ffe566;border:3px solid #1a1a1a;border-radius:50%;box-shadow:0 0 0 3px rgba(255,229,102,.35);z-index:1}
.crow{position:absolute;top:6px;left:-40px;font-size:22px;z-index:5;pointer-events:none;animation:crowfly 3.2s linear forwards}.crow span{display:inline-block;transform:scaleX(-1)}.crow .wd{animation:flapd .3s steps(1) infinite}.crow .wu{animation:flapu .3s steps(1) infinite}@keyframes flapu{0%{opacity:1}50%{opacity:0}}@keyframes flapd{0%{opacity:0}50%{opacity:1}}@keyframes crowfly{0%{left:-40px;top:14px}25%{top:4px}50%{top:16px}75%{top:6px}100%{left:110%;top:12px}}
.cloud{position:absolute;background:#fff;border:2px solid #1a1a1a;height:10px;border-radius:0;z-index:1;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border:2px solid #1a1a1a;border-radius:0}
.cloud.c1{left:10px;top:10px;width:28px}
.cloud.c1::before{width:14px;height:10px;left:4px;top:-8px}
.cloud.c1::after{width:12px;height:8px;right:2px;top:-6px}
.cloud.c2{left:42%;top:4px;width:22px;opacity:.9}
.cloud.c2::before{width:10px;height:8px;left:3px;top:-6px}
.shop-facade{position:absolute;left:0;right:0;bottom:0;height:80%;background:
  repeating-linear-gradient(0deg,#c4a574 0 10px,#b8956a 10px 11px),
  repeating-linear-gradient(90deg,#c4a574 0 16px,#a67c52 16px 17px);
  background-blend-mode:multiply;border-top:4px solid #1a1a1a}
.shop-vsign{position:absolute;right:5px;bottom:58px;width:40px;text-align:center;z-index:5;writing-mode:vertical-rl;text-orientation:upright;background:linear-gradient(90deg,#c0392b,#e74c3c,#c0392b);color:#fff;border:3px solid #1a1a1a;padding:6px 0;font-size:24px;font-weight:900;letter-spacing:3px;line-height:1;box-shadow:3px 3px 0 #1a1a1a;text-shadow:1px 1px 0 #7b241c}
.top-sign{flex-shrink:0;align-self:center;margin:2px auto 4px;background:linear-gradient(#e74c3c,#c0392b);color:#fff;border:4px solid #1a1a1a;padding:3px 22px;font-size:24px;font-weight:900;letter-spacing:4px;box-shadow:4px 4px 0 #1a1a1a;text-shadow:2px 2px 0 #7b241c;white-space:nowrap}
.shop-sign{position:absolute;left:50%;top:3px;transform:translateX(-50%);background:linear-gradient(#e74c3c,#c0392b);color:#fff;border:3px solid #1a1a1a;padding:2px 12px;font-size:16px;font-weight:900;box-shadow:3px 3px 0 #1a1a1a;z-index:4;white-space:nowrap}
.shop-lantern{position:absolute;left:6px;top:28%;font-size:18px;z-index:4;line-height:1;filter:drop-shadow(1px 1px 0 #1a1a1a)}
.shop-plant{position:absolute;right:46px;bottom:2px;font-size:18px;z-index:5;line-height:1;filter:drop-shadow(1px 1px 0 #1a1a1a)}
.shop-window{position:absolute;left:10px;bottom:12px;width:52px;height:38px;background:linear-gradient(160deg,#c8e8ff,#7ec8e8);border:3px solid #1a1a1a;box-shadow:inset 4px 4px 0 rgba(255,255,255,.4),2px 2px 0 #5d4037;z-index:2}
.shop-window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#1a1a1a;transform:translateX(-50%)}
.shop-window::before{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:#1a1a1a;transform:translateY(-50%)}
.shop-door{position:absolute;right:6px;bottom:0;width:38px;height:54px;background:#6d4c41;border:3px solid #1a1a1a;border-bottom:none;z-index:4;box-shadow:inset -6px 0 0 #5d4037;transition:background .15s}
.shop-door .door-panel{position:absolute;left:5px;right:5px;top:6px;bottom:18px;border:2px solid #4e342e;background:linear-gradient(90deg,#795548 0 50%,#6d4c41 50%)}
.shop-door .knob{position:absolute;left:5px;top:50%;width:7px;height:7px;background:#f1c40f;border:2px solid #1a1a1a;z-index:1}
.shop-door.open{background:#2c1810;box-shadow:inset 10px 0 0 #1a0f0a}
.shop-door.open .door-panel{opacity:.15}
.shop-door.open .knob{opacity:.3}
#walkLayer{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.shop-floor{position:absolute;left:0;right:72px;bottom:0;top:20%;display:flex;align-items:flex-end;justify-content:space-between;padding:4px 2px 2px 4px;gap:2px;z-index:2;background:
  linear-gradient(180deg,rgba(0,0,0,.12),transparent 28%),
  repeating-linear-gradient(90deg,#d7ccc8 0 10px,#bcaaa4 10px 20px),
  repeating-linear-gradient(0deg,transparent 0 8px,rgba(0,0,0,.08) 8px 9px);
  border-top:2px solid #8d6e63}
/* fixed table seats — no card panels */
.seat-slot{flex:1;min-width:0;max-width:72px;height:124px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 1px 32px;z-index:2}
.seat-slot.drop-hi,.seat-slot.tap-hi{filter:brightness(1.12)}
.seat-slot.drop-hi .table::before,.seat-slot.tap-hi .table::before{background:#7dcea0;box-shadow:inset 0 2px 0 #a9dfbf,inset 0 -2px 0 #1e8449,0 0 0 2px #2ecc71}
.seat-slot .puppet-zone{position:absolute;left:50%;bottom:48px;width:26px;height:34px;margin-left:-13px;z-index:1;pointer-events:none}
.seat-slot .puppet-zone .px-guest{margin:0;position:absolute;left:0;bottom:0}
.seat-slot .table{position:relative;width:100%;max-width:58px;height:22px;z-index:3;flex-shrink:0;pointer-events:none}
.seat-slot .table::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#a1662f;border:2px solid #1a1a1a;box-shadow:inset 0 2px 0 #c98a4b,inset 0 -2px 0 #7a4a1f}
.seat-slot .table .tl{position:absolute;top:10px;width:4px;height:10px;background:#6d4321;border:1px solid #1a1a1a}
.seat-slot .table .l1{left:5px}.seat-slot .table .l2{right:5px}
.seat-slot .tb-plate{position:absolute;left:50%;top:2px;width:14px;height:4px;margin-left:-7px;background:#fff;border:1px solid #1a1a1a;border-radius:50%;z-index:1}
.seat-slot.empty .table{opacity:.85}
.seat-slot .bubble{position:absolute;left:50%;bottom:0;transform:translateX(-50%);background:#fff;border:2px solid #1a1a1a;padding:1px 2px 2px;z-index:5;box-shadow:2px 2px 0 #c0392b;min-width:0;max-width:none;width:max-content;text-align:center;pointer-events:none}
.seat-slot .bubble::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #1a1a1a}
.seat-slot .bubble::before{content:"";position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid #fff;z-index:1}
.seat-slot .want{font-size:14px;line-height:1}
.seat-slot .want-n{font-size:13px;white-space:nowrap;word-break:keep-all;font-weight:900;color:#c0392b;line-height:1.1;word-break:break-all}

.seat-slot.eating .bubble{display:none}
.seat-slot.eating .food-on{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:18px;z-index:4;line-height:1;animation:eatBob .35s steps(2) infinite;pointer-events:none}
.seat-slot .eat-bar{position:absolute;left:8%;right:8%;bottom:54px;height:5px;background:#1a1a1a;border:2px solid #1a1a1a;z-index:6;overflow:hidden;pointer-events:none}
.seat-slot .eat-bar .eat-fill{height:100%;background:#2ecc71;width:0;animation:cookFill linear forwards}
.seat-slot.eating .px-guest.sit{animation:guestIdle .28s steps(2) infinite}

.seat-slot.mad .bubble{background:#ffe0e0;box-shadow:2px 2px 0 #c0392b}
.seat-slot .bubble::after,.seat-slot .bubble::before{display:none}
.seat-slot .bubble .want{display:none}
.seat-slot.mad .want-n{color:#922b21}
.seat-slot .g-say{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:7;background:#fff3b0;color:#922b21;border:2px solid #1a1a1a;border-radius:8px;bottom:84px;padding:0 3px;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:2px 2px 0 #1a1a1a;pointer-events:none;animation:madShake .3s steps(2) infinite}
.seat-slot .g-say.mine-say{background:#d5f5e3;color:#1e8449;animation:none;z-index:8}
.seat-slot .g-say.chat-say{background:#fff;color:#1a1a1a;animation:none}
.seat-slot[data-si="0"] .g-say{left:0;transform:none}
.seat-slot .g-say:has(.gf){white-space:normal;width:max-content;max-width:56px;font-size:11px;line-height:1.15;text-align:center;padding:1px 3px;bottom:80px}
.seat-slot .g-say .gf{display:block;font-size:22px;line-height:1;margin:-16px auto 1px;filter:drop-shadow(1px 1px 0 #1a1a1a)}
.seat-slot .complain{display:block;font-size:13px;font-weight:900;color:#c0392b;margin-top:1px;line-height:1.1}
.seat-slot.mad .puppet-zone{animation:madShake .35s steps(2) infinite}
@keyframes madShake{50%{transform:translateX(1px)}}

@keyframes eatBob{50%{transform:translateX(-50%) translateY(-2px) scale(1.05)}}

@keyframes speakIn{from{opacity:0;transform:translateX(-50%) translateY(4px) scale(.85)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
/* compat aliases for old .cust selectors used in JS */
.cust{/* seat hit target */}
.cust.drop-hi,.cust.tap-hi{filter:brightness(1.12)}
/* SNES / HD-2D style pixel guest sprite */
.px-guest{position:relative;width:26px;height:38px;margin:0 auto 2px;image-rendering:pixelated;filter:drop-shadow(1px 0 0 #1a1a1a) drop-shadow(-1px 0 0 #1a1a1a) drop-shadow(0 1px 0 #1a1a1a)}
.px-guest .g-shadow{position:absolute;left:3px;right:3px;bottom:-1px;height:5px;background:rgba(0,0,0,.28);border-radius:50%;z-index:0;pointer-events:none}
.px-guest .g-hair{position:absolute;left:4px;top:0;width:18px;height:6px;z-index:3;box-shadow:inset -2px 0 0 rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.15)}
.px-guest .g-hair::after{content:"";position:absolute;left:2px;top:-3px;width:14px;height:4px;background:inherit;box-shadow:inherit}
.px-guest .g-head{position:absolute;left:5px;top:4px;width:16px;height:12px;background:#f0c49a;z-index:2;box-shadow:inset -3px 0 0 #d4a574,inset 2px 2px 0 rgba(255,255,255,.35)}
.px-guest .g-head::before,.px-guest .g-head::after{content:"";position:absolute;top:4px;width:3px;height:3px;background:#1a1a1a}
.px-guest .g-head::before{left:3px}.px-guest .g-head::after{right:3px}
.px-guest .g-body{position:absolute;left:5px;top:15px;width:16px;height:12px;z-index:2;box-shadow:inset -3px 0 0 rgba(0,0,0,.22),inset 2px 2px 0 rgba(255,255,255,.22)}
.px-guest .g-body::after{content:"";position:absolute;left:5px;right:5px;bottom:0;height:3px;background:rgba(0,0,0,.12)}
.px-guest .g-legs{position:absolute;left:6px;bottom:4px;width:14px;height:10px;display:flex;justify-content:space-between;z-index:1}
.px-guest .g-legs i{display:block;width:5px;height:10px;background:#2c3e50;box-shadow:inset -2px 0 0 rgba(0,0,0,.35);transform-origin:top center}
.px-guest .g-legs i::after{content:"";position:absolute;bottom:0;left:0;width:6px;height:3px;background:#1a1a1a}
.px-guest .g-legs i{position:relative}
.px-guest.idle{animation:guestIdle .8s steps(2) infinite}
@keyframes guestIdle{50%{transform:translateY(-1px)}}
.px-guest.walk{animation:guestBob .18s steps(2) infinite}
.px-guest.walk .g-legs i.L{animation:legL .18s steps(2) infinite}
.px-guest.walk .g-legs i.R{animation:legR .18s steps(2) infinite}
@keyframes guestBob{50%{transform:translateY(-2px)}}
@keyframes legL{0%{transform:translateY(0) rotate(-8deg)}100%{transform:translateY(-3px) rotate(10deg)}}
@keyframes legR{0%{transform:translateY(-3px) rotate(10deg)}100%{transform:translateY(0) rotate(-8deg)}}
/* guest palettes — hair + shirt */
.px-guest.look0 .g-hair,.px-guest.look0 .g-hair::after{background:#3e2723}.px-guest.look0 .g-body{background:#c0392b}
.px-guest.look1 .g-hair,.px-guest.look1 .g-hair::after{background:#f1c40f}.px-guest.look1 .g-body{background:#2471a3}
.px-guest.look2 .g-hair,.px-guest.look2 .g-hair::after{background:#1a1a1a}.px-guest.look2 .g-body{background:#7d3c98}
.px-guest.look3 .g-hair,.px-guest.look3 .g-hair::after{background:#e67e22}.px-guest.look3 .g-body{background:#148f77}
.px-guest.look4 .g-hair,.px-guest.look4 .g-hair::after{background:#7f8c8d}.px-guest.look4 .g-body{background:#c2185b}
.px-guest.look5 .g-hair,.px-guest.look5 .g-hair::after{background:#ecf0f1}.px-guest.look5 .g-body{background:#1e8449}
.px-guest.look6 .g-hair,.px-guest.look6 .g-hair::after{background:#5d4037}.px-guest.look6 .g-body{background:#1a5276}
.px-guest.look7 .g-hair,.px-guest.look7 .g-hair::after{background:#922b21}.px-guest.look7 .g-body{background:#b9770e}
.px-guest.look8 .g-hair,.px-guest.look8 .g-hair::after{background:#2c3e50}.px-guest.look8 .g-body{background:#0e6655}
.px-guest.look9 .g-hair,.px-guest.look9 .g-hair::after{background:#b0bec5}.px-guest.look9 .g-body{background:#6c3483}
/* walk actors (absolute over shop) — JS sets left; faces door/seat */
.walker{position:absolute;bottom:4px;z-index:6;width:28px;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:0;transition:none;will-change:left}
.walker.face-left{transform:scaleX(-1)}
.walker.face-right{transform:scaleX(1)}
.walker .px-guest{margin:0}

/* plates between shop and kitchen */
.plate-lbl{text-align:center;font-size:12px;font-weight:900;background:linear-gradient(#3498db,#2980b9);color:#fff;border:3px solid #1a1a1a;padding:2px 4px;margin-top:6px;box-shadow:2px 2px 0 #1a1a1a}
.plate-row{display:flex;gap:4px;justify-content:space-between;align-items:stretch;min-height:74px;margin:4px 0 2px;flex-shrink:0;flex-wrap:nowrap;padding:0 2px}

/* plate-area runner */
.plate-stage{position:relative;flex-shrink:0;margin:4px 0 2px}
.plate-row{min-height:74px;margin:0;padding-bottom:36px}
.serve-runner{position:absolute;bottom:2px;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;width:42px;animation:serveMove 4.2s linear infinite}
.serve-runner .serve-sprite{display:flex;flex-direction:column;align-items:center;animation:serveFlip 4.2s steps(1) infinite}
.serve-runner .px-chef{transform:scale(.62);transform-origin:bottom center}
.serve-runner .serve-tag{font-size:9px;font-weight:900;background:#3498db;color:#fff;border:2px solid #1a1a1a;padding:0 3px;white-space:nowrap;box-shadow:2px 2px 0 #1a1a1a}
.serve-runner .px-chef.busywalk{animation:chefIdle .16s steps(2) infinite}
.serve-runner .px-chef.busywalk .ch-legs i.L{animation:chefLegL .16s steps(2) infinite}
.serve-runner .px-chef.busywalk .ch-legs i.R{animation:chefLegR .16s steps(2) infinite}
.serve-runner .px-chef.busywalk .ch-arm.R{animation:stirArm .22s steps(2) infinite}
@keyframes serveMove{

const DISHES=[
  {id:'ribs',n:'蜜汁排骨',e:'🍖', color:'#c0392b'},
  {id:'kungpao',n:'宮保雞丁',e:'🌶️', color:'#e67e22'},
  {id:'beef',n:'紅燒牛腩',e:'🥩', color:'#922b21'},
  {id:'noodle',n:'什錦湯麵',e:'🍜', color:'#d4a017'},
  {id:'shrimp',n:'蝦仁炒飯',e:'🦐', color:'#f39c12'}
];
const GOAL=12, MAX_GUESTS=6, ROUND=60, COOK_MS=2800, EAT_MS=2600, SPAWN_MS=900, WALK_IN_MS=850, WALK_OUT_MS=700, WAIT_MAD_MS=9000, WAIT_ANGRY_MS=16000, WAIT_LEAVE_MS=22000;
const LS='bbb_match_v5_hi';
const $=id=>document.getElementById(id);
let G=null, timer=null, spawnTimer=null, audioCtx=null;
let drag=null, sel=null;

function beep(f,d,type,v){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.value=v||0.07;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+(d||0.08));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+(d||0.08));
  }catch(e){}
}
function ac(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function sizzle(dur,v){
  try{const c=ac();const n=Math.floor(c.sampleRate*dur);const b=c.createBuffer(1,n,c.sampleRate);const d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(Math.random()<.3?1:.35);
    const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2500;
    const g=c.createGain();g.gain.setValueAtTime(v||.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
    s.connect(f);f.connect(g);g.connect(c.destination);s.start();}catch(e){}
}
const sfx={
  tap:()=>beep(500,.04,'square',.05),
  cook:()=>{sizzle(1.2,.07);beep(220,.06,'square',.04)},
  ready:()=>{beep(1318,.15,'triangle',.08);setTimeout(()=>beep(1760,.25,'triangle',.07),90)},
  ok:()=>{beep(523,.05);setTimeout(()=>beep(659,.05),70);setTimeout(()=>beep(784,.12),140)},
  bad:()=>beep(140,.15,'sawtooth',.06),
  angry:()=>{beep(180,.1,'sawtooth',.06);setTimeout(()=>beep(150,.18,'sawtooth',.06),110)},
  enter:()=>{beep(880,.05,'triangle',.05);setTimeout(()=>beep(660,.08,'triangle',.05),80)},
  plate:()=>beep(1200,.05,'triangle',.05),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*90))},
  lose:()=>{[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*100))}
};
/* chiptune BGM */
const music={on:(()=>{try{return localStorage.getItem('bbb_music')!=='0'}catch(e){return true}})(),timer:null,step:0,
  mel:[72,0,76,79,76,0,74,72,69,0,72,74,76,0,72,0, 74,0,77,81,79,77,76,74,72,0,76,74,72,0,0,0],
  bass:[48,55,52,55,45,52,48,52,50,57,53,57,43,50,47,50],
  start(){if(!this.on||this.timer)return;try{ac().resume()}catch(e){}
    this.timer=setInterval(()=>{const i=this.step++;const m=this.mel[i%32];
      if(!G||!G.run){this.stop();return}
      if(m)beep(440*Math.pow(2,(m-69)/12),.16,'square',.025);
      if(i%2===0){const b=this.bass[(i/2|0)%16];beep(440*Math.pow(2,(b-69)/12),.2,'triangle',.05)}
      if(i%4===2)sizzle(.03,.02);
    },170)},
  stop(){clearInterval(this.timer);this.timer=null},
  toggle(){this.on=!this.on;try{localStorage.setItem('bbb_music',this.on?'1':'0')}catch(e){}
    if(this.on&&G&&G.run)this.start();else this.stop();
    const b=document.getElementById('musicBtn');if(b)b.textContent=this.on?'🔊':'🔇'}
};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
function toast(t,ms){const e=$(/端|送|盤|惠顧|哇災|雅馬哈|上菜|開動|別桌|在吃|進門|再點客人/.test(t)?'serveSay':'prepSay');if(!e)return;e.textContent=t;e.style.marginLeft='0';e.classList.add('show');requestAnimationFrame(()=>{const r=e.getBoundingClientRect(),W=document.documentElement.clientWidth;let d=0;if(r.left<4)d=4-r.left;else if(r.right>W-4)d=W-4-r.right;if(d)e.style.marginLeft=d+'px'});clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms||900)}
function hiGet(){try{return +(localStorage.getItem(LS)||0)}catch(e){return window.__hi||0}}
function hiSet(n){if(n>hiGet()){window.__hi=n;try{localStorage.setItem(LS,String(n))}catch(e){}}}
function refreshHi(){$('hiScore').textContent='最高分：'+hiGet()}
function dishById(id){return DISHES.find(d=>d.id===id)}

function buildRound(){
  return {
    chefs:[0,1,2,3].map(i=>({id:'k'+i, look:i, cooking:null})),
    guests:[], plates:[], stickers:[],
    served:0, spawned:0, score:0, time:ROUND, run:true,
    nextFace:0, stickerSeq:0, guestSeq:0
  };
}
function activeGuests(){return G.guests.filter(g=>g.status==='waiting'||g.status==='entering'||g.status==='eating')}
function seatedGuests(){return G.guests.filter(g=>g.status==='waiting')}
function canSpawn(){return G.run && activeGuests().length<MAX_GUESTS}
function takenSeats(){
  const s=new Set();
  G.guests.forEach(g=>{
    if((g.status==='waiting'||g.status==='entering'||g.status==='eating'||g.status==='leaving') && g.seatIndex!=null) s.add(g.seatIndex);
  });
  return s;
}
function freeSeatIndex(){
  const taken=takenSeats();
  for(let i=0;i<MAX_GUESTS;i++) if(!taken.has(i)) return i;
  return -1;
}
/** left px of seat i relative to shop, for walker positioning */
function seatWalkerLeft(seatIndex){
  const shop=$('shop');
  const floor=$('custs');
  if(!shop||!floor) return 20+seatIndex*40;
  const slot=floor.querySelector(`[data-si="${seatIndex}"]`);
  const shopR=shop.getBoundingClientRect();
  if(slot){
    const r=slot.getBoundingClientRect();
    return Math.round(r.left-shopR.left+(r.width/2)-14);
  }
  // fallback percentages of floor width
  const fw=floor.clientWidth||shop.clientWidth;
  const pct=(seatIndex+.3)/MAX_GUESTS;
  return Math.round(fw*pct);
}
function doorWalkerLeft(){
  const shop=$('shop');
  if(!shop) return 280;
  return Math.max(40, shop.clientWidth-48);
}

/** Rebuild stickers = exactly one per waiting guest not yet cooking for that guest's sticker claim.
 *  Rule: each waiting guest owns one sticker (by guestId). Cooking marks sticker used.
 *  Entering guests get sticker only after seated (waiting). */
/** Remove plates nobody can eat: guest left / stormed out / not waiting for that plate. */
function pruneOrphanPlates(){
  if(!G) return;
  const waiting=seatedGuests();
  const waitingIds=new Set(waiting.map(g=>g.custId));
  const wantDish=new Set(waiting.map(g=>g.dishId));
  const before=G.plates.length;
  G.plates=G.plates.filter(p=>{
    if(p.guestId){
      // reserved for a table — only keep if that guest is still waiting
      return waitingIds.has(p.guestId);
    }
    // legacy / unbound plate — keep only if someone still wants this dish
    return wantDish.has(p.dishId);
  });
  return G.plates.length!==before;
}
function syncTray(){
  pruneOrphanPlates();
  const waiting=seatedGuests();
  const waitingIds=new Set(waiting.map(g=>g.custId));
  // Drop stickers for guests who left
  G.stickers=G.stickers.filter(s=>s.guestId && waitingIds.has(s.guestId));
  const byGuest={};
  G.stickers.forEach(s=>{ if(s.guestId) byGuest[s.guestId]=s; });
  waiting.forEach(g=>{
    const cookingFor=G.chefs.some(c=>c.cooking&&!c.cooking.burnt&&c.cooking.guestId===g.custId);
    const platedFor=G.plates.some(p=>p.guestId===g.custId);
    // Already in wok or ready on plate → no tray material needed
    if(cookingFor || platedFor){
      // hide/remove tray sticker for this guest
      G.stickers=G.stickers.filter(s=>s.guestId!==g.custId);
      delete byGuest[g.custId];
      return;
    }
    let s=byGuest[g.custId];
    if(!s || s.used){
      // recreate if missing or stuck used (e.g. plate stolen by same-dish guest)
      if(s) G.stickers=G.stickers.filter(x=>x.id!==s.id);
      s={id:'s'+(G.stickerSeq++), dishId:g.dishId, guestId:g.custId, used:false, t0:performance.now()};
      G.stickers.push(s);
      byGuest[g.custId]=s;
    }else{
      s.dishId=g.dishId;
      s.used=false;
    }
  });
}

function openDoor(ms){
  const d=$('door'); if(!d) return;
  d.classList.add('open');
  clearTimeout(d._t);
  d._t=setTimeout(()=>d.classList.remove('open'), ms||WALK_IN_MS);
}

function playWalkIn(guest, cb){
  openDoor(WALK_IN_MS);
  const layer=$('walkLayer');
  const el=document.createElement('div');
  el.className='walker face-left';
  el.innerHTML=guestPuppet(guest.look,'walk');
  const startX=doorWalkerLeft();
  const endX=seatWalkerLeft(guest.seatIndex);
  el.style.left=startX+'px';
  el.style.bottom='4px';
  layer.appendChild(el);
  // reflow then transition to seat
  void el.offsetWidth;
  el.style.transition='left '+WALK_IN_MS+'ms steps(8)';
  requestAnimationFrame(()=>{ el.style.left=endX+'px'; });
  setTimeout(()=>{
    el.remove();
    if(cb) cb();
  }, WALK_IN_MS+30);
}


const REVIEWS=[

function spawnGuest(){
  if(!canSpawn()) return null;
  const seat=freeSeatIndex();
  if(seat<0) return null;
  const d=DISHES[Math.floor(Math.random()*DISHES.length)];
  const g={
    custId:'c'+(G.guestSeq++),
    look:G.nextFace++%GUEST_LOOKS,
    dishId:d.id,
    status:'entering',
    seatIndex:seat
  };
  G.guests.push(g);
  G.spawned++;
  sfx.enter();
  renderAll(); // tables stay; walker goes to seat
  playWalkIn(g, ()=>{
    if(!G||!G.run) return;
    const gg=G.guests.find(x=>x.custId===g.custId);
    if(gg && gg.status==='entering'){
      gg.status='waiting'; // seated → speak order bubble
      gg.waitT0=performance.now();
      gg.madLevel=0;
      syncTray();
      renderAll();
    }
  });
  return g;
}

function renderAll(){if(G)pruneOrphanPlates();renderHud();renderCusts();renderKitchen();renderPlates();renderTray();updateHint()}

  $('hudDone').textContent='服務 '+G.served+' 位';
  $('hudScore').textContent='分數 '+G.score;
  $('hudTime').textContent='⏱ '+Math.max(0,Math.ceil(G.time));

function renderCusts(){
  const bySeat={};
  G.guests.forEach(g=>{
    if(g.seatIndex==null) return;
    if(g.status==='waiting'||g.status==='entering'||g.status==='eating') bySeat[g.seatIndex]=g;
  });
  let html='';
  for(let i=0;i<MAX_GUESTS;i++){
    const o=bySeat[i];
    if(o && o.status==='waiting'){
      const d=dishById(o.dishId);
      const mad=o.madLevel||0;
      const madCls=mad>=1?' mad':'';
      const mine=G.mineDish===o.dishId&&performance.now()<G.mineUntil;
      const chat=(!mad&&G.chat&&G.chat.id===o.custId&&performance.now()<G.chat.until)?G.chat.text:'';

function tick(){
  if(!G||!G.run) return;
  G.time-=0.1;
  if(G.time<=0){G.time=0;renderHud();endGame(false);return}
  renderHud();
  let needCust=false;
  const now=performance.now();
  G.guests.forEach(g=>{
    if(g.status!=='waiting'||!g.waitT0) return;
    // if food already cooking for them, less angry — still count wait but slower complain
    const cookingFor=G.chefs.some(c=>c.cooking&&c.cooking.guestId===g.custId);
    const plateReady=G.plates.some(p=>p.dishId===g.dishId);
    const waited=now-g.waitT0;
    const madMs=cookingFor||plateReady ? WAIT_MAD_MS*1.35 : WAIT_MAD_MS;
    const angryMs=cookingFor||plateReady ? WAIT_ANGRY_MS*1.35 : WAIT_ANGRY_MS;
    const leaveMs=cookingFor||plateReady ? WAIT_LEAVE_MS*1.4 : WAIT_LEAVE_MS;
    let lvl=0;
    if(waited>=angryMs) lvl=2;
    else if(waited>=madMs) lvl=1;
    if(lvl!==(g.madLevel||0)){ g.madLevel=lvl; needCust=true; if(lvl===1) toast('有客人在催單！',700); if(lvl===2) toast('客人快生氣了！',700); }
    if(waited>=leaveMs){
      // leave angry — schedule via flag so we don't mutate mid-forEach oddly
      g._storm=true;
    }
  });
  const stormers=G.guests.filter(g=>g._storm);
  stormers.forEach(g=>{ g._storm=false; guestStormOut(g.custId,'等太久，客人氣走了！'); });
  if(needCust && !stormers.length) renderCusts();
}

  clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1500);
},4500);
const CHATS=['好香喔！','好期待喔～','聞起來好讚','肚子好餓','這家好有名','等等要吃飽飽','好想吃喔'];
setInterval(()=>{
  if(!G||!G.run) return;
  const cand=G.guests.filter(g=>g.status==='waiting'&&!(g.madLevel>0));
  if(!cand.length) return;
  const g=cand[Math.floor(Math.random()*cand.length)];
  G.chat={id:g.custId,text:CHATS[Math.floor(Math.random()*CHATS.length)],until:performance.now()+1600};
  renderAll();
  setTimeout(()=>{if(G&&G.run)renderAll()},1650);
},2600);
function shoutMine(dishId){
  if(!G) return; G.mineDish=dishId; G.mineUntil=performance.now()+1200; renderAll();
  setTimeout(()=>{if(G&&G.mineUntil<=performance.now()+20)renderAll()},1250);
}
function handleTapSelect(info){
  if(sel&&sel.kind===info.kind&&sel.id===info.id){clearSel();return}
  clearSel();
  sel={kind:info.kind,id:info.id,dishId:info.dishId};
  sfx.tap();
  if(info.kind==='sticker'){
    const el=document.querySelector(`[data-sticker="${info.id}"]`);
    if(el) el.classList.add('sel');
    document.querySelectorAll('[data-wok]').forEach(w=>{
      const c=chefById(w.getAttribute('data-wok'));
      if(c&&!c.cooking) w.classList.add('tap-hi');
    });
    toast(['炒快一點！','🎵 夢的翅膀已經受了傷～','🎵 嘟嘟嘟他好壞～'][Math.floor(Math.random()*3)],1400);
  }else{
    const slot=document.querySelector(`[data-plate="${info.id}"]`);
    if(slot) slot.classList.add('sel');
    document.querySelectorAll('.cust.waiting').forEach(c=>{
      if(c.getAttribute('data-dish')===info.dishId) c.classList.add('tap-hi');
    });
    shoutMine(info.dishId);
    toast('再點客人送菜',800);
  }
}
function onTapTarget(e){
  if(!G||!G.run||!sel) return;
  if(sel.kind==='sticker'){
    const wok=e.target.closest('[data-wok]');
    if(wok){const id=sel.id, cid=wok.getAttribute('data-wok'); clearSel(); startCook(id,cid); e.stopPropagation()}
  }else if(sel.kind==='plate'){
    const cust=e.target.closest('[data-cust]');
    if(cust){const id=sel.id, cid=cust.getAttribute('data-cust'); clearSel(); deliverPlate(id,cid); e.stopPropagation()}
  }
}

const play=$('s-play');
play.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, {passive:false});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', ()=>{drag=null;hideGhost()});
play.addEventListener('touchstart', onDown, {passive:true});
window.addEventListener('touchmove', onMove, {passive:false});
window.addEventListener('touchend', onUp);
play.addEventListener('click', onTapTarget);

$('btnStart').onclick=()=>{sfx.tap();startGame()};
$('btnAgain').onclick=()=>{sfx.tap();startGame()};
$('btnHome').onclick=()=>{sfx.tap();show('s-start');refreshHi()};

setInterval(()=>{if(!G||!G.run)return;const e=$('serveSay');if(!e||e.classList.contains('show'))return;if(Math.random()<.35)toast(Math.random()<.5?'哇災！':'嘿！雅馬哈！',1300)},6000);
setInterval(()=>{if(!G||!G.run)return;const e=$('prepSay');if(!e||e.classList.contains('show'))return;if(Math.random()<.3)toast(Math.random()<.5?'🎵 夢的翅膀已經受了傷～':'🎵 嘟嘟嘟他好壞～',2200)},8000);
window.__BBB={
  start:startGame, end:(w)=>endGame(!!w), get:()=>G,
  startCook, finishCook, deliverPlate, spawnGuest, canSpawn, syncTray,
  GOAL, MAX_GUESTS, ROUND, COOK_MS, EAT_MS, SPAWN_MS, WALK_IN_MS, dishes:DISHES,
  seatedGuests:()=>G?seatedGuests():[], freeSeatIndex:()=>G?freeSeatIndex():-1
};
refreshHi();
})();
</script>
</body>
